# =====================================================================
# 像素沙盒 pixel-sandbox · Nginx 反向代理配置
# 用途：让玩家通过「域名」访问游戏，并修复「网页能开、联机连不上」的问题
# 问题根因：Nginx 默认不转发 WebSocket 的 Upgrade 升级请求，
#           导致客户端 ws://域名 握手被代理吃掉，卡在“正在连接…”。
# 解决：在反代里加上 proxy_http_version 1.1 + Upgrade/Connection 头。
# =====================================================================

# ---------------------------------------------------------------------
# 片段 A：宝塔「反向代理 → 配置文件」里要用的 location / 块
# 在 宝塔面板 → 网站 → 站点 → 设置 → 反向代理 → 编辑/配置文件，
# 把里面的 location / { ... } 整段替换为下面这段即可。
# ---------------------------------------------------------------------
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ===== 关键：支持 WebSocket 联机 =====
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 联机是长连接，调大超时避免掉线
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;
}

# ---------------------------------------------------------------------
# 片段 B：完整站点配置（不走宝塔、直接改 nginx.conf / 站点 conf 时用）
# 二选一：HTTP（80） 或 HTTPS（443，联机走 wss 更安全）
# 把 your.domain.com 换成你的真实域名，证书路径按实际改。
# ---------------------------------------------------------------------

# --- HTTP 版本（80 端口，ws://域名 访问）---
server {
    listen 80;
    server_name your.domain.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }
}

