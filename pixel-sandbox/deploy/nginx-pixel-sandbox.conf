# =====================================================================
# 验证清单（改完在服务器上跑）：
#   1. nginx -t            # 检查语法
#   2. nginx -s reload     # 重载配置（宝塔点“重载”也行）
#   3. 浏览器开 F12 → Network → WS，应能看到 101 Switching Protocols
#   4. 游戏内应显示“已连接”，多人能看到彼此
# =====================================================================
