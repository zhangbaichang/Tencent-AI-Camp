<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Sandbox 状态</title><style>body{margin:0;background:#090d1c;color:#eaf2ff;font-family:Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(760px,92vw);background:#121a30;border:1px solid #2a3b61;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0008}.ok{color:#4cff88}.muted{color:#9aa8c2}.addr{font-size:20px;word-break:break-all;background:#0a1020;padding:14px;border-radius:12px;margin:8px 0}.row{margin:18px 0}.tag{display:inline-block;padding:4px 9px;border-radius:999px;background:#193b2b}.small{font-size:13px}</style></head><body><main class="card"><h1>🎮 Pixel Sandbox</h1><p id="status" class="muted">正在读取服务器状态…</p><div class="row"><b>公网访问地址</b><div id="http" class="addr">等待 SakuraFrp…</div></div><div class="row"><b>WebSocket</b><div id="ws" class="addr">等待 SakuraFrp…</div></div><div class="row"><span class="tag">本地服务 0.0.0.0:8080</span></div><p id="source" class="muted small"></p></main><script>async function load(){try{const r=await fetch('/api/public-address',{cache:'no-store'});const d=await r.json();if(d.ok){status.textContent='服务器在线 · 已检测到 SakuraFrp 隧道';status.className='ok';http.textContent=d.url;ws.textContent=d.wsUrl;source.textContent='来源：'+d.source+(d.logFile?' · '+d.logFile:'')}else{status.textContent='服务器在线 · 等待 SakuraFrp 隧道';status.className='muted';http.textContent='尚未检测到公网地址';ws.textContent='尚未检测到公网地址';source.textContent=d.message||''}}catch(e){status.textContent='无法读取服务器状态';status.className='muted'}}load();setInterval(load,5000)</script></body></html>
